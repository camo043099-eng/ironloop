<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ironloop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23FF6B3D'/%3E%3Cstop offset='1' stop-color='%2335D5C3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230A0C11'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23151B26'/%3E%3Cellipse cx='32' cy='32' rx='21' ry='7.5' fill='none' stroke='url(%23g)' stroke-width='4.5' transform='rotate(-24 32 32)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div id="splash" hidden>
  <svg id="splash-anillo" viewBox="0 0 120 120" width="132" height="132">
    <circle cx="60" cy="60" r="46" fill="none" stroke="#232B3A" stroke-width="11"/>
    <circle class="arco arco-1" cx="60" cy="60" r="46" fill="none" stroke="#FF6B3D" stroke-width="11" stroke-linecap="round" stroke-dasharray="92 197" transform="rotate(-90 60 60)"/>
    <circle class="arco arco-2" cx="60" cy="60" r="46" fill="none" stroke="#35D5C3" stroke-width="11" stroke-linecap="round" stroke-dasharray="92 197" stroke-dashoffset="-97" transform="rotate(-90 60 60)"/>
    <circle class="arco arco-3" cx="60" cy="60" r="46" fill="none" stroke="#B6F24A" stroke-width="11" stroke-linecap="round" stroke-dasharray="92 197" stroke-dashoffset="-194" transform="rotate(-90 60 60)"/>
  </svg>
  <div class="splash-nombre display"><span class="iron">IRON</span><span class="loop">LOOP</span></div>
</div>
<header>
  <div class="logo display"><span class="iron">IRON</span><span class="loop">LOOP</span></div>
  <div class="tag" id="tag">Tablero de entrenamiento</div>
  <button id="hdr-avatar" hidden aria-label="Mi cuenta"></button>
</header>
<main id="principal">
  <div class="cargando" id="cargando">Cargando tu tablero…</div>
  <section id="v-cuenta" class="vista"></section>
  <section id="v-hoy" class="vista"></section>
  <section id="v-cuerpo" class="vista"></section>
  <section id="v-rutina" class="vista"></section>
  <section id="v-sesion" class="vista">
    <div id="resplandor"></div>
    <div class="sesion-inner">
      <div class="estado-txt" id="estado-txt">Sesión</div>
      <div class="anillo-wrap">
        <svg width="262" height="262"><circle cx="131" cy="131" r="122" fill="none" stroke="#232B3A" stroke-width="14"/><circle id="anillo" cx="131" cy="131" r="122" fill="none" stroke="#9C8CFF" stroke-width="14" stroke-linecap="round" stroke-dasharray="766.5" stroke-dashoffset="766.5"/></svg>
        <div id="vid-marco"><video id="vid" muted loop playsinline></video></div>
      </div>
      <div class="reloj display" id="reloj">0:00</div>
      <div class="ej-nombre" id="ej-nombre">—</div>
      <div class="ej-meta" id="ej-meta">—</div>
      <div class="controles" id="controles"></div>
      <div class="siguiente" id="siguiente"></div>
    </div>
  </section>
  <section id="v-progreso" class="vista"></section>
  <section id="v-salud" class="vista"></section>
</main>
<nav id="nav">
  <button data-vista="hoy" class="activo">Hoy</button>
  <button data-vista="cuerpo">Cuerpo</button>
  <button data-vista="rutina">Rutina</button>
  <button data-vista="progreso">Progreso</button>
  <button data-vista="salud">Salud</button>
</nav>
<div id="hoja-fondo"></div>
<aside id="hoja" aria-hidden="true"></aside>
<div id="onboarding"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
