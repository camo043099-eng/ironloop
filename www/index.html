<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ironloop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0C11'/%3E%3Ccircle cx='25' cy='32' r='13' fill='none' stroke='%23FF6B3D' stroke-width='6'/%3E%3Ccircle cx='41' cy='32' r='13' fill='none' stroke='%2335D5C3' stroke-width='6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
  <div class="logo display"><span class="iron">IRON</span><span class="loop">LOOP</span></div>
  <div class="tag" id="tag">Tablero de entrenamiento</div>
</header>
<main id="principal">
  <div class="cargando" id="cargando">Cargando tu tablero…</div>
  <section id="v-hoy" class="vista"></section>
  <section id="v-cuerpo" class="vista"></section>
  <section id="v-rutina" class="vista"></section>
  <section id="v-sesion" class="vista">
    <div id="resplandor"></div>
    <div class="sesion-inner">
      <div class="estado-txt" id="estado-txt">Sesión</div>
      <div class="anillo-wrap">
        <svg width="262" height="262"><circle cx="131" cy="131" r="122" fill="none" stroke="#232B3A" stroke-width="14"/><circle id="anillo" cx="131" cy="131" r="122" fill="none" stroke="#9C8CFF" stroke-width="14" stroke-linecap="round" stroke-dasharray="766.5" stroke-dashoffset="766.5"/></svg>
        <div id="vid-marco"><video id="vid" muted loop playsinline></video></div>
      </div>
      <div class="reloj display" id="reloj">0:00</div>
      <div class="ej-nombre" id="ej-nombre">—</div>
      <div class="ej-meta" id="ej-meta">—</div>
      <div class="controles" id="controles"></div>
      <div class="siguiente" id="siguiente"></div>
    </div>
  </section>
  <section id="v-progreso" class="vista"></section>
  <section id="v-salud" class="vista"></section>
</main>
<nav id="nav">
  <button data-vista="hoy" class="activo">Hoy</button>
  <button data-vista="cuerpo">Cuerpo</button>
  <button data-vista="rutina">Rutina</button>
  <button data-vista="progreso">Progreso</button>
  <button data-vista="salud">Salud</button>
</nav>
<div id="hoja-fondo"></div>
<aside id="hoja" aria-hidden="true"></aside>
<div id="onboarding"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
