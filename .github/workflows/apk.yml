name: Compilar APK Ironloop
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reparar codificacion de archivos y guardar la reparacion
        run: |
          python3 - <<'PYEOF'
          import base64, os, re
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', '.github', 'node_modules', 'dataset', 'android')]
              for f in files:
                  p = os.path.join(root, f)
                  try:
                      data = open(p, 'rb').read()
                      txt = data.decode('ascii').strip()
                  except Exception:
                      continue
                  limpia = txt.replace('\n', '').replace('\r', '')
                  if len(limpia) > 20 and re.fullmatch(r'[A-Za-z0-9+/=]+', limpia):
                      try:
                          dec = base64.b64decode(limpia)
                      except Exception:
                          continue
                      if dec and dec != data:
                          open(p, 'wb').write(dec)
                          print('reparado', p)
          PYEOF
          git config user.name "ironloop-ci"
          git config user.email "ci@ironloop.local"
          git add -A
          git diff --cached --quiet || git commit -m "Reparar codificacion de archivos [skip ci]"
          git push origin HEAD:main || true
      - name: Traer el dataset (fotos y GIF oficiales)
        run: git clone --depth 1 https://github.com/camo043099-eng/exercises-dataset.git dataset
      - name: Preparar media (fotos + GIF convertidos a MP4)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python3 tools/preparar_media.py dataset
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar dependencias y crear el proyecto Android
        run: |
          npm ci
          npx cap add android
          node tools/ajustar_android.mjs
          pip install --quiet pillow
          python3 tools/generar_iconos.py android/app/src/main/res
          npx cap sync android
      - name: Compilar APK (debug firmada, instalable)
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Publicar el APK en una release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ironloop APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
      - name: Publicar el APK como artefacto (respaldo)
        uses: actions/upload-artifact@v4
        with:
          name: ironloop-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
