name: Publicar PWA (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['www/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Traer el dataset (fotos y GIF oficiales)
        run: git clone --depth 1 https://github.com/camo043099-eng/exercises-dataset.git dataset
      - name: Reensamblar datos y preparar media
        run: python3 tools/preparar_media.py dataset
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
